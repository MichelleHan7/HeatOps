[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "heatops"
version = "0.1.0"
description = "Heat-aware field operations optimization powered by hyperlocal temperature intelligence"
requires-python = ">=3.11"

dependencies = [
    "requests",
    "python-dotenv",
    "shapely",
    "ortools",
]

[project.scripts]
heatops-evaluate = "heatops.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
demo = [
    "altair>=5,<7",
    "pandas>=2,<4",
    "pydeck>=0.9,<1",
    "streamlit>=1.62,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/heatops/data/scenarios/phoenix-demo" = [
    "data/scenarios/phoenix-demo/jobs.json",
    "data/scenarios/phoenix-demo/metadata.json",
    "data/scenarios/phoenix-demo/temperature_matrix.json",
    "data/scenarios/phoenix-demo/workers.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
