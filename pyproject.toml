[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "heatops"
version = "0.1.0"
description = "Heat-aware field operations optimization powered by hyperlocal temperature intelligence"
requires-python = ">=3.11"

dependencies = [
    "requests",
    "python-dotenv",
    "shapely",
    "ortools",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
